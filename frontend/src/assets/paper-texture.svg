<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320">
  <!--
    Speckled paper, modeled on the LPL deck (slide 15): near-white stock with
    fine grain, scattered small grey flecks, and a few larger soft specks.
    Tileable (stitchTiles) so it can repeat as a page background.
  -->
  <defs>
    <!-- Fine overall grain -->
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3" stitchTiles="stitch" />
      <feColorMatrix type="matrix" values="0 0 0 0 0.42  0 0 0 0 0.42  0 0 0 0 0.44  0 0 0 0.16 0" />
    </filter>

    <!-- Small flecks: stretch contrast, then keep only the highest noise peaks -->
    <filter id="flecks" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="2" seed="11" stitchTiles="stitch" />
      <feColorMatrix type="matrix" values="0 0 0 0 0.34  0 0 0 0 0.35  0 0 0 0 0.38  7 0 0 0 -4.3" />
      <feComponentTransfer>
        <feFuncA type="discrete" tableValues="0 0.5" />
      </feComponentTransfer>
    </filter>

    <!-- Occasional larger, softer specks -->
    <filter id="specks" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.22" numOctaves="1" seed="29" stitchTiles="stitch" />
      <feColorMatrix type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.46  0 0 0 0 0.48  0 6 0 0 -4.0" />
      <feComponentTransfer>
        <feFuncA type="discrete" tableValues="0 0.28" />
      </feComponentTransfer>
      <feGaussianBlur stdDeviation="0.4" />
    </filter>
  </defs>

  <rect width="320" height="320" fill="#f3f3f1" />
  <rect width="320" height="320" filter="url(#grain)" />
  <rect width="320" height="320" filter="url(#specks)" />
  <rect width="320" height="320" filter="url(#flecks)" />
</svg>
